
services:
  postgres:
    image: postgres:15
    container_name: bilancino_postgres
    environment:
      POSTGRES_USER: metabase_user
      POSTGRES_PASSWORD: ${METABASE_PSW}
      POSTGRES_DB: bilancino
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: bilancino
      MB_DB_PORT: 5432
      MB_DB_USER: metabase_user
      MB_DB_PASS: Mymetabasepsw33!
      MB_DB_HOST: postgres
    depends_on:
      - postgres

volumes:
  postgres-data: